<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forest Run</title>

  <style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#20251d;font:14px Arial,sans-serif}
.page{width:min(500px,94vw);margin:18px auto}
.top{display:flex;justify-content:space-between;align-items:end;padding:6px 2px 9px;border-bottom:2px solid #20251d}
.top h1{margin:0;font:bold 28px Georgia,serif}
.top small{font-size:10px;font-weight:bold;letter-spacing:1px}
.screen{margin-top:12px;padding:4px;background:#111610;border:2px solid #20251d}
canvas{display:block;width:100%;height:auto;touch-action:none}
.keys{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.keys button{height:42px;border:2px solid #20251d;background:transparent;font-weight:bold;cursor:pointer;touch-action:none}
.keys button:active{background:#d9d1bb}
.note{text-align:center;font-size:10px;font-weight:bold}
.note span{border-bottom:1px solid #20251d}
</style>
</head>

<body>
  <main class="page">
    <header class="top">
      <h1>FOREST RUN</h1>
      <small>ROAD 01</small>
    </header>

    <section class="screen">
      <canvas id="game" width="460" height="700"></canvas>
    </section>

    <div class="keys">
      <button id="leftBtn">LEFT</button>
      <button id="boostBtn">BOOST</button>
      <button id="rightBtn">RIGHT</button>
    </div>

    <p class="note">
      <span>A / D</span> or <span>← / →</span>
      &nbsp; • &nbsp;
      <span>SPACE</span> boost
      &nbsp; • &nbsp;
      <span>ENTER</span> start
    </p>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const road = {
      left:70,
      right:390,
      lane:80
    };

    const player = {
      x:209,
      y:590,
      w:42,
      h:70
    };

    let traffic = [];
    let coins = [];

    let leftHeld = false;
    let rightHeld = false;
    let boostHeld = false;

    let playing = false;
    let crashed = false;

    let score = 0;
    let lives = 3;
    let fuel = 100;
    let speed = 4;
    let frame = 0;
    let roadMove = 0;
    let shield = false;
    let selectedCar = 0;

    let best = Number(localStorage.getItem("forestRunBest") || 0);

    const cars = [
      {name:"RUST", color:"#a9513e"},
      {name:"MOSS", color:"#607d54"},
      {name:"LAKE", color:"#587996"},
      {name:"SUN", color:"#c39a4b"}
    ];

    function resetGame(){
      player.x = 209;
      traffic = [];
      coins = [];

      score = 0;
      lives = 3;
      fuel = 100;
      speed = 4;
      frame = 0;
      roadMove = 0;
      shield = false;

      leftHeld = false;
      rightHeld = false;
      boostHeld = false;

      crashed = false;
      playing = true;
    }

    function addTraffic(){
      if(traffic.length >= 6) return;

      const lane = Math.floor(Math.random() * 4);

      traffic.push({
        x:road.left + lane * road.lane + 21,
        y:-75,
        w:38,
        h:64,
        speed:2 + Math.random() * 2,
        color:Math.random() > .5 ? "#587593" : "#718765"
      });
    }

    function addCoin(){
      const lane = Math.floor(Math.random() * 4);

      coins.push({
        x:road.left + lane * road.lane + 40,
        y:-12,
        size:8
      });
    }

    function hits(a,b){
      return a.x < b.x + b.w &&
             a.x + a.w > b.x &&
             a.y < b.y + b.h &&
             a.y + a.h > b.y;
    }

    function update(){
      if(!playing) return;

      frame++;
      roadMove += speed;

      if(leftHeld) player.x -= 6;
      if(rightHeld) player.x += 6;

      if(player.x < road.left) player.x = road.left;
      if(player.x + player.w > road.right){
        player.x = road.right - player.w;
      }

      if(boostHeld && fuel > 0){
        speed += .06;
        fuel -= .75;
        if(speed > 10) speed = 10;
      }else{
        if(speed > 4) speed -= .02;
        fuel += .12;
        if(fuel > 100) fuel = 100;
      }

      if(frame % 45 === 0) addTraffic();
      if(frame % 80 === 0) addCoin();

      for(let i=traffic.length-1;i>=0;i--){
        const car = traffic[i];

        car.y += car.speed + speed * .4;

        if(car.y > 720){
          traffic.splice(i,1);
          score += 10;
          continue;
        }

        if(hits(player,car)){
          traffic.splice(i,1);

          if(shield){
            shield = false;
            score += 25;
          }else{
            lives--;
            player.x = 209;

            if(lives <= 0){
              playing = false;
              crashed = true;

              if(score > best){
                best = score;
                localStorage.setItem("forestRunBest",best);
              }
            }
          }
        }
      }

      for(let i=coins.length-1;i>=0;i--){
        const coin = coins[i];

        coin.y += speed * .5;

        if(coin.y > 720){
          coins.splice(i,1);
          continue;
        }

        if(
          coin.x > player.x &&
          coin.x < player.x + player.w &&
          coin.y > player.y &&
          coin.y < player.y + player.h
        ){
          coins.splice(i,1);
          score += 5;
          fuel += 15;

          if(fuel > 100) fuel = 100;
        }
      }

      if(score > 0 && score % 200 === 0){
        shield = true;
      }
    }

    function drawTree(x,y){
      ctx.fillStyle = "#573b24";
      ctx.fillRect(x-3,y+18,6,36);

      ctx.fillStyle = "#2c542f";

      ctx.beginPath();
      ctx.arc(x,y,23,0,Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x-15,y+12,17,0,Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x+15,y+12,17,0,Math.PI*2);
      ctx.fill();
    }

    function drawRoad(){
      ctx.fillStyle = "#244129";
      ctx.fillRect(0,0,460,700);

      for(let y=-70;y<760;y+=75){
        const yy = y + roadMove % 75;
        drawTree(25,yy);
        drawTree(55,yy+30);
        drawTree(435,yy+15);
        drawTree(405,yy+45);
      }

      ctx.fillStyle = "#444541";
      ctx.fillRect(road.left,0,road.right-road.left,700);

      ctx.fillStyle = "#c5a15a";
      ctx.fillRect(road.left,0,3,700);
      ctx.fillRect(road.right-3,0,3,700);

      ctx.fillStyle = "#c7c2ad";

      for(let lane=1;lane<4;lane++){
        const x = road.left + lane * road.lane;

        for(let y=-70;y<700;y+=75){
          ctx.fillRect(x,y + roadMove % 75,2,30);
        }
      }
    }

    function drawCar(car,color){
      ctx.fillStyle = "#111";
      ctx.fillRect(car.x-4,car.y+15,6,18);
      ctx.fillRect(car.x+car.w-2,car.y+15,6,18);
      ctx.fillRect(car.x-4,car.y+car.h-25,6,18);
      ctx.fillRect(car.x+car.w-2,car.y+car.h-25,6,18);

      ctx.fillStyle = color;
      ctx.fillRect(car.x+4,car.y+3,car.w-8,car.h-6);

      ctx.fillStyle = "#1d3740";
      ctx.fillRect(car.x+9,car.y+12,car.w-18,20);

      ctx.fillStyle = "#efd372";
      ctx.fillRect(car.x+8,car.y+5,7,5);
      ctx.fillRect(car.x+car.w-15,car.y+5,7,5);
    }

    function drawCoin(coin){
      ctx.fillStyle = "#dfb54c";
      ctx.beginPath();
      ctx.arc(coin.x,coin.y,coin.size,0,Math.PI*2);
      ctx.fill();

      ctx.strokeStyle = "#7b5d25";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawHud(){
      ctx.fillStyle = "#fff";
      ctx.font = "bold 15px Arial";
      ctx.textAlign = "left";

      ctx.fillText("SCORE " + score,12,24);
      ctx.fillText("♥".repeat(lives),12,46);

      ctx.fillStyle = "#151815";
      ctx.fillRect(315,14,125,10);

      ctx.fillStyle = "#caa24a";
      ctx.fillRect(315,14,125 * fuel / 100,10);

      ctx.fillStyle = "#fff";
      ctx.font = "11px Arial";
      ctx.fillText("FUEL",315,39);

      ctx.textAlign = "right";
      ctx.fillText(Math.round(speed * 25) + " km/h",448,39);

      if(shield){
        ctx.textAlign = "center";
        ctx.fillStyle = "#dfc15a";
        ctx.font = "bold 12px Arial";
        ctx.fillText("SHIELD READY",230,65);
      }
    }

    function drawMenu(){
      drawRoad();

      ctx.textAlign = "center";

      ctx.fillStyle = "#e8e0cc";
      ctx.font = "bold 40px Georgia";
      ctx.fillText("FOREST RUN",230,120);

      ctx.fillStyle = "#a8b09e";
      ctx.font = "13px Arial";
      ctx.fillText("CHOOSE YOUR CAR",230,150);

      for(let i=0;i<4;i++){
        const x = 35 + i * 100;

        ctx.fillStyle = i === selectedCar ? "#a98744" : "#293329";
        ctx.fillRect(x,205,90,125);

        drawCar(
          {x:x+24,y:220,w:42,h:70},
          cars[i].color
        );

        ctx.fillStyle = "#fff";
        ctx.font = "11px Arial";
        ctx.fillText(cars[i].name,x+45,316);
      }

      ctx.fillStyle = "#d4b15b";
      ctx.font = "bold 16px Arial";
      ctx.fillText("PRESS ENTER",230,390);

      ctx.fillStyle = "#98a18e";
      ctx.font = "12px Arial";
      ctx.fillText("Coins refill fuel",230,425);
      ctx.fillText("Every 200 points gives a shield",230,445);

      ctx.fillStyle = "#ddd5be";
      ctx.font = "bold 14px Arial";
      ctx.fillText("BEST " + best,230,490);
    }

    function drawGameOver(){
      drawRoad();

      for(const car of traffic){
        drawCar(car,car.color);
      }

      drawCar(player,cars[selectedCar].color);

      ctx.fillStyle = "#0b0f0c";
      ctx.fillRect(45,225,370,220);

      ctx.textAlign = "center";

      ctx.fillStyle = "#d4b15b";
      ctx.font = "bold 36px Georgia";
      ctx.fillText("CRASHED",230,285);

      ctx.fillStyle = "#fff";
      ctx.font = "16px Arial";
      ctx.fillText("Score " + score,230,325);
      ctx.fillText("Best " + best,230,350);

      ctx.fillStyle = "#94a18e";
      ctx.font = "bold 14px Arial";
      ctx.fillText("PRESS ENTER TO TRY AGAIN",230,410);
    }

    function draw(){
      if(!playing){
        if(crashed) drawGameOver();
        else drawMenu();
        return;
      }

      drawRoad();

      for(const car of traffic){
        drawCar(car,car.color);
      }

      for(const coin of coins){
        drawCoin(coin);
      }

      drawCar(player,cars[selectedCar].color);
      drawHud();
    }

    function setControl(name,value){
      if(name === "left") leftHeld = value;
      if(name === "right") rightHeld = value;
      if(name === "boost") boostHeld = value;
    }

    function holdButton(id,name){
      const button = document.getElementById(id);

      button.addEventListener("pointerdown",event=>{
        event.preventDefault();
        setControl(name,true);

        if(button.setPointerCapture){
          button.setPointerCapture(event.pointerId);
        }
      });

      button.addEventListener("pointerup",()=>{
        setControl(name,false);
      });

      button.addEventListener("pointercancel",()=>{
        setControl(name,false);
      });

      button.addEventListener("pointerleave",()=>{
        if(!button.hasPointerCapture || !button.hasPointerCapture(0)){
          setControl(name,false);
        }
      });
    }

    window.addEventListener("keydown",event=>{
      const key = event.key.toLowerCase();

      if(key === "a" || key === "arrowleft"){
        leftHeld = true;
        event.preventDefault();
      }

      if(key === "d" || key === "arrowright"){
        rightHeld = true;
        event.preventDefault();
      }

      if(event.code === "Space"){
        boostHeld = true;
        event.preventDefault();
      }

      if(event.key === "Enter" && !playing){
        resetGame();
        event.preventDefault();
      }
    });

    window.addEventListener("keyup",event=>{
      const key = event.key.toLowerCase();

      if(key === "a" || key === "arrowleft") leftHeld = false;
      if(key === "d" || key === "arrowright") rightHeld = false;
      if(event.code === "Space") boostHeld = false;
    });

    window.addEventListener("blur",()=>{
      leftHeld = false;
      rightHeld = false;
      boostHeld = false;
    });

    canvas.addEventListener("pointerdown",event=>{
      if(playing) return;

      const box = canvas.getBoundingClientRect();
      const x = (event.clientX - box.left) * 460 / box.width;
      const y = (event.clientY - box.top) * 700 / box.height;

      if(!crashed && y >= 200 && y <= 340){
        const choice = Math.floor((x - 35) / 100);

        if(choice >= 0 && choice < 4){
          selectedCar = choice;
          return;
        }
      }

      resetGame();
    });

    holdButton("leftBtn","left");
    holdButton("rightBtn","right");
    holdButton("boostBtn","boost");

    function loop(){
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
