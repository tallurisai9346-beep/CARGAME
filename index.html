<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forest Run</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#151711;
  color:#eee4c9;
  font-family:Arial,sans-serif;
}
.game{
  width:min(94vw,500px);
  text-align:center;
}
h1{
  margin:8px 0 3px;
  font-family:Georgia,serif;
  letter-spacing:3px;
  font-size:30px;
  color:#d4b05a;
}
.note{
  margin:0 0 10px;
  color:#8e9787;
  font-size:12px;
}
.frame{
  position:relative;
}
canvas{
  display:block;
  width:100%;
  height:auto;
  border:5px solid #33382d;
  border-top-color:#b4944c;
  background:#203d24;
  box-shadow:8px 8px 0 #090a08;
  touch-action:none;
}
.controls{
  display:flex;
  gap:8px;
  margin-top:10px;
}
button{
  flex:1;
  border:1px solid #6f704f;
  background:#292d25;
  color:#e9dfc2;
  padding:13px 5px;
  font-weight:bold;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}
button:active{background:#806c39}
.boost{border-color:#b38d43}
.help{
  margin:9px 0 0;
  color:#858d7f;
  font-size:11px;
}
</style>
</head>

<body>
<div class="game">
  <h1>FOREST RUN</h1>
  <p class="note">KEEP THE WHEELS CLEAN</p>

  <div class="frame">
    <canvas id="game" width="460" height="700"></canvas>
  </div>

  <div class="controls">
    <button id="leftBtn">◀ LEFT</button>
    <button id="boostBtn" class="boost">BOOST</button>
    <button id="rightBtn">RIGHT ▶</button>
  </div>

  <p class="help">Keyboard: A / D or ← / → &nbsp; • &nbsp; Space = boost</p>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 460;
const H = 700;
const ROAD_LEFT = 70;
const ROAD_RIGHT = 390;
const LANE_W = (ROAD_RIGHT - ROAD_LEFT) / 4;

let car;
let enemies = [];
let coins = [];
let particles = [];

let movingLeft = false;
let movingRight = false;
let boosting = false;

let playing = false;
let gameOver = false;

let score = 0;
let lives = 3;
let fuel = 100;
let speed = 4;
let frame = 0;
let roadMove = 0;
let shield = false;
let selectedCar = 0;

let best = Number(localStorage.getItem("forestRunBest") || 0);

const cars = [
  {name:"RUST", color:"#b6533e"},
  {name:"MOSS", color:"#628956"},
  {name:"LAKE", color:"#50769a"},
  {name:"SUN", color:"#c39a45"}
];

function startGame(){
  car = {
    x: ROAD_LEFT + LANE_W * 2 + 9,
    y: 590,
    w: 42,
    h: 70
  };

  enemies = [];
  coins = [];
  particles = [];

  score = 0;
  lives = 3;
  fuel = 100;
  speed = 4;
  frame = 0;
  roadMove = 0;
  shield = false;

  movingLeft = false;
  movingRight = false;
  boosting = false;

  playing = true;
  gameOver = false;
}

function laneX(lane, width){
  return ROAD_LEFT + lane * LANE_W + (LANE_W - width) / 2;
}

function makeEnemy(){
  if(enemies.length >= 6) return;

  const width = 38;
  const lane = Math.floor(Math.random() * 4);

  enemies.push({
    x: laneX(lane, width),
    y: -80,
    w: width,
    h: 64,
    speed: 2 + Math.random() * 2.2,
    color: Math.random() < .4 ? "#748c66" : "#526d8c"
  });
}

function makeCoin(){
  const lane = Math.floor(Math.random() * 4);

  coins.push({
    x: ROAD_LEFT + lane * LANE_W + LANE_W / 2,
    y: -12,
    r: 8,
    angle: 0
  });
}

function collision(a,b){
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function crashParticles(x,y){
  for(let i=0;i<16;i++){
    particles.push({
      x:x,
      y:y,
      dx:(Math.random()-.5)*6,
      dy:(Math.random()-.5)*6,
      life:25 + Math.random()*20
    });
  }
}

function update(){
  if(!playing) return;

  frame++;
  roadMove += speed;

  if(movingLeft) car.x -= 6;
  if(movingRight) car.x += 6;

  if(car.x < ROAD_LEFT)
    car.x = ROAD_LEFT;

  if(car.x + car.w > ROAD_RIGHT)
    car.x = ROAD_RIGHT - car.w;

  if(boosting && fuel > 0){
    speed += .07;
    fuel -= .8;

    if(speed > 10.5)
      speed = 10.5;
  }else{
    if(speed > 4)
      speed -= .025;

    fuel += .13;

    if(fuel > 100)
      fuel = 100;
  }

  if(frame % 42 === 0)
    makeEnemy();

  if(frame % 75 === 0)
    makeCoin();

  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];

    e.y += e.speed + speed * .4;

    if(e.y > H + 20){
      enemies.splice(i,1);
      score += 10;
      continue;
    }

    if(collision(car,e)){
      enemies.splice(i,1);
      crashParticles(car.x + car.w/2, car.y + car.h/2);

      if(shield){
        shield = false;
        score += 25;
      }else{
        lives--;
        car.x = ROAD_LEFT + LANE_W * 2 + 9;

        if(lives <= 0){
          playing = false;
          gameOver = true;

          if(score > best){
            best = score;
            localStorage.setItem("forestRunBest",best);
          }
        }
      }
    }
  }

  for(let i=coins.length-1;i>=0;i--){
    const c = coins[i];

    c.y += speed * .5;
    c.angle += .15;

    if(c.y > H + 20){
      coins.splice(i,1);
      continue;
    }

    if(
      c.x > car.x &&
      c.x < car.x + car.w &&
      c.y > car.y &&
      c.y < car.y + car.h
    ){
      coins.splice(i,1);
      score += 8;
      fuel += 18;

      if(fuel > 100)
        fuel = 100;

      if(score >= 100 && score % 100 < 8)
        shield = true;
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];

    p.x += p.dx;
    p.y += p.dy;
    p.life--;

    if(p.life <= 0)
      particles.splice(i,1);
  }

  if(score > 0 && score % 250 < 2)
    shield = true;
}

function tree(x,y,small){
  ctx.fillStyle="#513722";
  ctx.fillRect(x-3,y+20,6,34);

  ctx.fillStyle=small ? "#315a34" : "#21482a";

  ctx.beginPath();
  ctx.arc(x,y,small ? 16 : 24,0,Math.PI*2);
  ctx.arc(x-15,y+12,small ? 12 : 18,0,Math.PI*2);
  ctx.arc(x+15,y+12,small ? 12 : 18,0,Math.PI*2);
  ctx.fill();
}

function drawBackground(){
  ctx.fillStyle="#1d3a23";
  ctx.fillRect(0,0,W,H);

  for(let y=-60;y<H+80;y+=72){
    const yy = y + roadMove % 72;

    tree(25,yy,false);
    tree(55,yy+28,true);
    tree(435,yy+12,false);
    tree(405,yy+43,true);
  }

  ctx.fillStyle="#303630";
  ctx.fillRect(ROAD_LEFT,0,ROAD_RIGHT-ROAD_LEFT,H);

  ctx.fillStyle="#9a7b43";
  ctx.fillRect(ROAD_LEFT,0,3,H);
  ctx.fillRect(ROAD_RIGHT-3,0,3,H);

  ctx.fillStyle="#bdb9a5";

  for(let lane=1;lane<4;lane++){
    const x=ROAD_LEFT + lane * LANE_W;

    for(let y=-70;y<H;y+=75){
      ctx.fillRect(x-1,y + roadMove % 75,2,30);
    }
  }
}

function drawCar(c,color){
  ctx.fillStyle="#10110f";

  ctx.fillRect(c.x-4,c.y+14,6,18);
  ctx.fillRect(c.x+c.w-2,c.y+14,6,18);
  ctx.fillRect(c.x-4,c.y+c.h-25,6,18);
  ctx.fillRect(c.x+c.w-2,c.y+c.h-25,6,18);

  ctx.fillStyle=color;

  ctx.beginPath();
  ctx.roundRect(c.x+4,c.y+2,c.w-8,c.h-4,6);
  ctx.fill();

  ctx.fillStyle="#18303a";

  ctx.beginPath();
  ctx.roundRect(c.x+9,c.y+12,c.w-18,20,4);
  ctx.fill();

  ctx.fillStyle="#f0d477";
  ctx.fillRect(c.x+8,c.y+5,7,5);
  ctx.fillRect(c.x+c.w-15,c.y+5,7,5);
}

function drawCoin(c){
  ctx.save();

  ctx.translate(c.x,c.y);
  ctx.scale(Math.abs(Math.cos(c.angle))*.35+.65,1);

  ctx.fillStyle="#dfb64c";
  ctx.beginPath();
  ctx.arc(0,0,c.r,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawHud(){
  ctx.textAlign="left";
  ctx.fillStyle="#f0ead9";
  ctx.font="bold 15px Arial";

  ctx.fillText("SCORE "+score,12,24);
  ctx.fillText("♥".repeat(lives),12,46);

  ctx.fillStyle="#151815";
  ctx.fillRect(312,14,136,10);

  ctx.fillStyle="#d1a74d";
  ctx.fillRect(312,14,136* fuel/100,10);

  ctx.fillStyle="#f0ead9";
  ctx.font="11px Arial";
  ctx.fillText("BOOST",312,39);

  ctx.textAlign="right";
  ctx.fillText(Math.round(speed*25)+" km/h",448,39);

  if(shield){
    ctx.textAlign="center";
    ctx.fillStyle="#dfc35d";
    ctx.font="bold 12px Arial";
    ctx.fillText("SHIELD READY",230,62);
  }
}

function drawMenu(){
  drawBackground();

  ctx.textAlign="center";

  ctx.fillStyle="#e7dcc0";
  ctx.font="bold 42px Georgia";
  ctx.fillText("FOREST RUN",230,120);

  ctx.fillStyle="#9ca594";
  ctx.font="13px Arial";
  ctx.fillText("CHOOSE YOUR CAR",230,150);

  for(let i=0;i<4;i++){
    const x=34+i*101;

    ctx.fillStyle=i===selectedCar ? "#b4914b" : "#273129";
    ctx.fillRect(x,205,91,128);

    drawCar({
      x:x+25,
      y:222,
      w:42,
      h:70
    },cars[i].color);

    ctx.fillStyle="#eee8d7";
    ctx.font="11px Arial";
    ctx.fillText(cars[i].name,x+45,318);
  }

  ctx.fillStyle="#d8b65d";
  ctx.font="bold 16px Arial";
  ctx.fillText("PRESS ENTER OR START",230,390);

  ctx.fillStyle="#9ca494";
  ctx.font="12px Arial";
  ctx.fillText("Collect coins to refill boost",230,425);
  ctx.fillText("Reach 100 points to unlock a shield",230,445);

  ctx.fillStyle="#ded6c2";
  ctx.font="bold 14px Arial";
  ctx.fillText("BEST "+best,230,490);
}

function drawGameOver(){
  drawBackground();

  for(const e of enemies)
    drawCar(e,e.color);

  drawCar(car,cars[selectedCar].color);

  ctx.fillStyle="#0b100c";
  ctx.fillRect(45,225,370,235);

  ctx.textAlign="center";

  ctx.fillStyle="#d5b35b";
  ctx.font="bold 36px Georgia";
  ctx.fillText("CRASHED",230,285);

  ctx.fillStyle="#eee8d7";
  ctx.font="16px Arial";
  ctx.fillText("Score  "+score,230,325);
  ctx.fillText("Best   "+best,230,351);

  ctx.fillStyle="#93a18e";
  ctx.font="bold 14px Arial";
  ctx.fillText("PRESS ENTER TO TRY AGAIN",230,410);
}

function draw(){
  if(!playing){
    if(gameOver)
      drawGameOver();
    else
      drawMenu();

    return;
  }

  drawBackground();

  for(const e of enemies)
    drawCar(e,e.color);

  for(const c of coins)
    drawCoin(c);

  drawCar(car,cars[selectedCar].color);

  for(const p of particles){
    ctx.fillStyle="#dfb34d";
    ctx.fillRect(p.x,p.y,3,3);
  }

  drawHud();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

/* ---------------- KEYBOARD CONTROLS ---------------- */

window.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    movingLeft=true;
    e.preventDefault();
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    movingRight=true;
    e.preventDefault();
  }

  if(e.code==="Space"){
    boosting=true;
    e.preventDefault();
  }

  if(e.key==="Enter" && !playing){
    startGame();
    e.preventDefault();
  }
});

window.addEventListener("keyup",function(e){
  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
    movingLeft=false;

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
    movingRight=false;

  if(e.code==="Space")
    boosting=false;
});

window.addEventListener("blur",function(){
  movingLeft=false;
  movingRight=false;
  boosting=false;
});

/* ---------------- BUTTON CONTROLS ---------------- */

function holdButton(button, action){
  button.addEventListener("pointerdown",function(e){
    e.preventDefault();
    action(true);
  });

  button.addEventListener("pointerup",function(e){
    e.preventDefault();
    action(false);
  });

  button.addEventListener("pointercancel",function(){
    action(false);
  });

  button.addEventListener("pointerleave",function(){
    action(false);
  });
}

holdButton(
  document.getElementById("leftBtn"),
  value => movingLeft=value
);

holdButton(
  document.getElementById("rightBtn"),
  value => movingRight=value
);

holdButton(
  document.getElementById("boostBtn"),
  value => boosting=value
);

/* ---------------- CANVAS START / CAR SELECT ---------------- */

canvas.addEventListener("click",function(e){
  if(playing) return;

  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*W/rect.width;
  const y=(e.clientY-rect.top)*H/rect.height;

  if(!gameOver && y>=190 && y<=350){
    const n=Math.floor((x-34)/101);

    if(n>=0 && n<4){
      selectedCar=n;
      return;
    }
  }

  startGame();
});

loop();
</script>
</body>
</html>
