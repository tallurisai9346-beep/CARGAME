<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forest Run</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#172018;color:#eee5c7;font:14px Arial;text-align:center}
canvas{width:min(94vw,460px);height:auto;margin:18px auto 6px;display:block;border:4px solid #c49a52;background:#234021;touch-action:none}
p{margin:4px;color:#aebaa3}
</style>
</head>
<body>
<canvas id="game" width="460" height="700"></canvas>
<p>A/D or ←/→ to drive • touch left/right to steer</p>

<script>
const c=document.getElementById("game"),x=c.getContext("2d");
const L=72,R=388;
let car={x:209,y:590,w:42,h:70};
let bad=[],keys={},score=0,lives=3,best=+localStorage.forestBest||0;
let play=false,dead=false,t=0,road=0;

function reset(){
  car.x=209; bad=[]; score=0; lives=3; t=0; road=0;
  play=true; dead=false;
}

function addCar(){
  if(bad.length>5)return;
  let lane=Math.floor(Math.random()*4), w=(R-L)/4;
  let xx=L+lane*w+(w-38)/2;
  for(let b of bad)if(Math.abs(b.x-xx)<40&&b.y<90)return;
  bad.push({x:xx,y:-70,w:38,h:64,
    s:2+Math.random()*1.8,a:Math.random()<.25});
}

function crash(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&
         a.y<b.y+b.h&&a.y+a.h>b.y;
}

function update(){
  if(!play)return;
  t++; road=(road+3)%55;

  if(keys.left)car.x-=6;
  if(keys.right)car.x+=6;
  car.x=Math.max(L+5,Math.min(R-car.w-5,car.x));

  if(t%45===0)addCar();

  for(let i=bad.length-1;i>=0;i--){
    let b=bad[i];
    b.y+=b.s+2.2;
    if(b.y>730){
      bad.splice(i,1); score+=10; continue;
    }
    if(crash(car,b)){
      bad.splice(i,1); lives--; car.x=209;
      if(lives<=0){
        play=false; dead=true;
        if(score>best){
          best=score;
          localStorage.forestBest=best;
        }
      }
    }
  }
}

function tree(px,py,s){
  x.fillStyle="#5a3b20";x.fillRect(px-3,py+s*.3,6,s);
  x.fillStyle="#17411e";
  x.beginPath();
  x.arc(px,py,s*.45,0,7);
  x.arc(px-s*.3,py+s*.2,s*.35,0,7);
  x.arc(px+s*.3,py+s*.2,s*.35,0,7);
  x.fill();
}

function background(){
  x.fillStyle="#193d20";x.fillRect(0,0,460,700);

  for(let y=-20;y<740;y+=65){
    let yy=y+road*.7;
    tree(25,yy,42);tree(55,yy+30,32);
    tree(435,yy+15,40);tree(405,yy+42,32);
  }

  x.fillStyle="#2c332e";x.fillRect(L,0,R-L,700);
  x.fillStyle="#c4aa67";x.fillRect(L,0,3,700);x.fillRect(R-3,0,3,700);

  x.fillStyle="#d7d0a9";
  for(let n=1;n<4;n++){
    let lx=L+n*(R-L)/4;
    for(let y=-55+road;y<700;y+=70)x.fillRect(lx-1,y,2,30);
  }
}

function drawCar(b,color,alien,player){
  x.fillStyle="#111";
  x.fillRect(b.x-3,b.y+14,5,17);x.fillRect(b.x+b.w-2,b.y+14,5,17);
  x.fillRect(b.x-3,b.y+b.h-25,5,17);x.fillRect(b.x+b.w-2,b.y+b.h-25,5,17);

  x.fillStyle=color;x.fillRect(b.x+4,b.y+3,b.w-8,b.h-6);
  x.fillStyle=alien?"#baffd0":"#17384d";
  x.fillRect(b.x+9,b.y+12,b.w-18,19);

  x.fillStyle=player?"#e7c85b":"#ffc84f";
  x.fillRect(b.x+7,b.y+4,7,5);x.fillRect(b.x+b.w-14,b.y+4,7,5);

  if(alien){
    x.strokeStyle="#d67cff";x.beginPath();
    x.moveTo(b.x+10,b.y+5);x.lineTo(b.x+6,b.y-8);
    x.moveTo(b.x+b.w-10,b.y+5);x.lineTo(b.x+b.w-6,b.y-8);x.stroke();
  }
}

function textBox(title,line){
  x.fillStyle="rgba(8,16,9,.9)";x.fillRect(38,245,384,190);
  x.textAlign="center";x.fillStyle="#e0b85d";
  x.font="bold 34px Arial";x.fillText(title,230,305);
  x.fillStyle="#d5ddca";x.font="16px Arial";x.fillText(line,230,342);
  x.fillStyle="#91b66d";x.font="bold 15px Arial";x.fillText("PRESS ENTER",230,390);
}

function draw(){
  background();
  for(let b of bad)drawCar(b,b.a?"#6da24d":"#527aa5",b.a,false);
  drawCar(car,"#c66a45",false,true);

  x.textAlign="left";x.fillStyle="#f0e5c7";x.font="bold 17px Arial";
  x.fillText("SCORE "+score,14,27);x.fillText("BEST "+best,14,49);
  x.textAlign="right";x.fillStyle="#e3c65c";x.fillText("♥".repeat(lives),446,27);

  if(!play&&!dead)textBox("FOREST RUN","Dodge the cars");
  if(dead)textBox("CRASHED","Score: "+score);
}

document.addEventListener("keydown",e=>{
  let k=e.key.toLowerCase();
  if(e.key==="ArrowLeft"||k==="a")keys.left=true;
  if(e.key==="ArrowRight"||k==="d")keys.right=true;
  if(e.key==="Enter"&&!play)reset();
  if(e.key==="ArrowLeft"||e.key==="ArrowRight")e.preventDefault();
});
document.addEventListener("keyup",e=>{
  let k=e.key.toLowerCase();
  if(e.key==="ArrowLeft"||k==="a")keys.left=false;
  if(e.key==="ArrowRight"||k==="d")keys.right=false;
});

c.addEventListener("pointerdown",e=>{
  if(!play){reset();return}
  let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*460/r.width;
  keys.left=px<230;keys.right=px>=230;
});
c.addEventListener("pointermove",e=>{
  if(!play||e.buttons===0)return;
  let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*460/r.width;
  keys.left=px<230;keys.right=px>=230;
});
c.addEventListener("pointerup",()=>{
  keys.left=false;keys.right=false;
});

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
