<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forest Run</title>
<style>
*{box-sizing:border-box}
:root{
  --ink:#171914;
  --paper:#d9cfad;
  --gold:#b99550;
  --green:#273b28;
  --road:#343733;
}
body{
  margin:0;
  min-height:100vh;
  background:var(--ink);
  color:var(--paper);
  font-family:Verdana,Arial,sans-serif;
}
.page{
  width:min(520px,94vw);
  margin:24px auto;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:end;
  border-bottom:1px solid #575b45;
  padding:0 2px 9px;
}
h1{
  margin:0;
  font:700 30px Georgia,serif;
  letter-spacing:1px;
}
header span{
  color:#89917e;
  font-size:10px;
  letter-spacing:2px;
}
#game{
  display:block;
  width:100%;
  margin-top:14px;
  background:#203b24;
  border:2px solid #696b50;
  box-shadow:6px 6px 0 #080908;
  touch-action:none;
}
.panel{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-top:10px;
}
button{
  border:1px solid #666b50;
  background:#222820;
  color:#dcd3b7;
  padding:12px 4px;
  font-weight:bold;
  font-size:11px;
  cursor:pointer;
  touch-action:none;
  user-select:none;
}
button:active{background:#8b713b;color:#fff}
.tip{
  text-align:center;
  color:#747d6d;
  font-size:10px;
  line-height:1.6;
  margin:9px 0;
}
</style>
</head>
<body>
<main class="page">
<header>
  <h1>FOREST RUN</h1>
  <span>FIELD TEST 01</span>
</header>

<canvas id="game" width="460" height="700"></canvas>

<div class="panel">
  <button id="left">LEFT</button>
  <button id="boost">BOOST</button>
  <button id="right">RIGHT</button>
</div>

<div class="tip">
  A / D or arrow keys to steer · Space to boost · Enter to start<br>
  Collect leaves for fuel. Survive long enough to find the hidden shortcut.
</div>
</main>

<script>
const canvas=document.querySelector("#game");
const ctx=canvas.getContext("2d");

const road={left:70,right:390};
const lane=(road.right-road.left)/4;

let player;
let traffic=[];
let pickups=[];
let dust=[];
let running=false;
let finished=false;

let left=false;
let right=false;
let boost=false;

let score=0;
let best=+localStorage.getItem("forest-best")||0;
let lives=3;
let fuel=100;
let speed=4;
let ticks=0;
let selected=0;
let shield=0;
let streak=0;
let shortcut=0;

const paint=[
  ["RUST","#b45740"],
  ["MOSS","#668c58"],
  ["LAKE","#52779b"],
  ["SUN","#c49b4b"]
];

function start(){
  player={x:road.left+lane*2+9,y:590,w:42,h:70};
  traffic=[];
  pickups=[];
  dust=[];
  score=0;
  lives=3;
  fuel=100;
  speed=4;
  ticks=0;
  shield=0;
  streak=0;
  shortcut=0;
  left=right=boost=false;
  running=true;
  finished=false;
}

function enemy(){
  if(traffic.length>5)return;
  const w=38;
  const n=Math.floor(Math.random()*4);
  traffic.push({
    x:road.left+n*lane+(lane-w)/2,
    y:-75,
    w:w,
    h:63,
    v:2+Math.random()*2.5,
    c:Math.random()<.35?"#718466":"#526d89"
  });
}

function pickup(){
  const n=Math.floor(Math.random()*4);
  pickups.push({
    x:road.left+n*lane+lane/2,
    y:-12,
    r:8,
    spin:0
  });
}

function overlaps(a,b){
  return a.x<b.x+b.w &&
         a.x+a.w>b.x &&
         a.y<b.y+b.h &&
         a.y+a.h>b.y;
}

function puff(x,y){
  for(let i=0;i<10;i++){
    dust.push({
      x:x,y:y,
      dx:(Math.random()-.5)*5,
      dy:(Math.random()-.5)*5,
      life:20+Math.random()*18
    });
  }
}

function update(){
  if(!running)return;

  ticks++;

  if(left)player.x-=5.8;
  if(right)player.x+=5.8;

  player.x=Math.max(road.left,Math.min(road.right-player.w,player.x));

  if(boost && fuel>0){
    speed=Math.min(10.5,speed+.065);
    fuel=Math.max(0,fuel-.78);
  }else{
    speed=Math.max(4,speed-.025);
    fuel=Math.min(100,fuel+.12);
  }

  if(ticks%43===0)enemy();
  if(ticks%80===0)pickup();

  /* A rare shortcut appears after a long clean run. */
  if(ticks>900 && shortcut===0 && Math.random()<.002)shortcut=1;
  if(shortcut>0)shortcut++;

  for(let i=traffic.length-1;i>=0;i--){
    const car=traffic[i];
    car.y+=car.v+speed*.4;

    if(car.y>720){
      traffic.splice(i,1);
      score+=10;
      streak++;
      continue;
    }

    if(overlaps(player,car)){
      traffic.splice(i,1);
      puff(player.x+21,player.y+35);

      if(shield){
        shield=0;
        score+=30;
      }else{
        lives--;
        streak=0;
        player.x=road.left+lane*2+9;

        if(lives<=0){
          running=false;
          finished=true;
          if(score>best){
            best=score;
            localStorage.setItem("forest-best",best);
          }
        }
      }
    }
  }

  for(let i=pickups.length-1;i>=0;i--){
    const item=pickups[i];
    item.y+=speed*.5;
    item.spin+=.15;

    if(item.y>720){
      pickups.splice(i,1);
      continue;
    }

    if(item.x>player.x && item.x<player.x+player.w &&
       item.y>player.y && item.y<player.y+player.h){
      pickups.splice(i,1);
      score+=8;
      fuel=Math.min(100,fuel+20);
      if(streak>=5)shield=1;
    }
  }

  /* Original extra feature: clean-run bonus. */
  if(streak>0 && streak%8===0){
    score+=4;
    streak++;
  }

  /* Original extra feature: shortcut reward. */
  if(shortcut===45){
    score+=50;
    fuel=Math.min(100,fuel+30);
    shield=1;
  }

  for(let i=dust.length-1;i>=0;i--){
    const p=dust[i];
    p.x+=p.dx;
    p.y+=p.dy;
    p.life--;
    if(p.life<=0)dust.splice(i,1);
  }
}

function tree(x,y,small){
  ctx.fillStyle="#513720";
  ctx.fillRect(x-3,y+19,6,33);

  ctx.fillStyle=small?"#355c37":"#244b2b";
  ctx.beginPath();
  ctx.arc(x,y,small?15:23,0,Math.PI*2);
  ctx.arc(x-14,y+11,small?12:17,0,Math.PI*2);
  ctx.arc(x+14,y+11,small?12:17,0,Math.PI*2);
  ctx.fill();
}

function background(){
  ctx.fillStyle="#1d3922";
  ctx.fillRect(0,0,460,700);

  for(let y=-60;y<760;y+=72){
    const p=y+(ticks*speed)%72;
    tree(25,p,false);
    tree(55,p+27,true);
    tree(435,p+14,false);
    tree(405,p+43,true);
  }

  ctx.fillStyle="#343733";
  ctx.fillRect(road.left,0,road.right-road.left,700);

  ctx.fillStyle="#927544";
  ctx.fillRect(road.left,0,3,700);
  ctx.fillRect(road.right-3,0,3,700);

  ctx.fillStyle="#b8b5a1";
  for(let n=1;n<4;n++){
    const x=road.left+n*lane;
    for(let y=-60;y<700;y+=76){
      ctx.fillRect(x-1,y+(ticks*speed)%76,2,29);
    }
  }
}

function car(c,color){
  ctx.fillStyle="#10110f";
  ctx.fillRect(c.x-4,c.y+15,6,18);
  ctx.fillRect(c.x+c.w-2,c.y+15,6,18);
  ctx.fillRect(c.x-4,c.y+c.h-25,6,18);
  ctx.fillRect(c.x+c.w-2,c.y+c.h-25,6,18);

  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.roundRect(c.x+4,c.y+2,c.w-8,c.h-4,6);
  ctx.fill();

  ctx.fillStyle="#1b3038";
  ctx.beginPath();
  ctx.roundRect(c.x+9,c.y+12,c.w-18,20,4);
  ctx.fill();

  ctx.fillStyle="#efd375";
  ctx.fillRect(c.x+8,c.y+5,7,5);
  ctx.fillRect(c.x+c.w-15,c.y+5,7,5);
}

function leaf(p){
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(Math.sin(p.spin)*.2);
  ctx.fillStyle="#d2aa4e";
  ctx.beginPath();
  ctx.ellipse(0,0,7,10,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function hud(){
  ctx.textAlign="left";
  ctx.fillStyle="#eee8d6";
  ctx.font="bold 14px Arial";
  ctx.fillText("SCORE "+score,12,23);
  ctx.fillText("♥".repeat(lives),12,44);

  ctx.fillStyle="#121612";
  ctx.fillRect(310,13,138,10);
  ctx.fillStyle="#c9a34f";
  ctx.fillRect(310,13,138*fuel/100,10);

  ctx.fillStyle="#eee8d6";
  ctx.font="10px Arial";
  ctx.fillText("FUEL",310,37);

  ctx.textAlign="right";
  ctx.fillText(Math.round(speed*25)+" km/h",448,37);

  if(shield){
    ctx.textAlign="center";
    ctx.fillStyle="#dfbf5b";
    ctx.font="bold 11px Arial";
    ctx.fillText("SHIELD",230,59);
  }

  if(streak>=3){
    ctx.fillText("CLEAN x"+streak,230,76);
  }

  if(shortcut>0 && shortcut<45){
    ctx.fillStyle="#a8ad8c";
    ctx.fillText("SHORTCUT AHEAD",230,94);
  }
}

function menu(){
  background();
  ctx.textAlign="center";

  ctx.fillStyle="#e5dac0";
  ctx.font="bold 42px Georgia";
  ctx.fillText("FOREST RUN",230,120);

  ctx.fillStyle="#909a88";
  ctx.font="12px Arial";
  ctx.fillText("PICK A CAR",230,150);

  for(let i=0;i<4;i++){
    const x=33+i*101;
    ctx.fillStyle=i===selected?"#aa8a49":"#283129";
    ctx.fillRect(x,200,92,130);
    car({x:x+25,y:220,w:42,h:70},paint[i][1]);
    ctx.fillStyle="#eee8d7";
    ctx.font="10px Arial";
    ctx.fillText(paint[i][0],x+46,317);
  }

  ctx.fillStyle="#d4b25b";
  ctx.font="bold 15px Arial";
  ctx.fillText("PRESS ENTER TO START",230,390);

  ctx.fillStyle="#929b89";
  ctx.font="11px Arial";
  ctx.fillText("Clean streaks earn shields",230,423);
  ctx.fillText("A rare shortcut gives a big bonus",230,442);

  ctx.fillStyle="#d9d0b7";
  ctx.font="bold 13px Arial";
  ctx.fillText("BEST "+best,230,485);
}

function endScreen(){
  background();
  traffic.forEach(e=>car(e,e.c));
  car(player,paint[selected][1]);

  ctx.fillStyle="#0b0f0c";
  ctx.fillRect(48,225,364,225);

  ctx.textAlign="center";
  ctx.fillStyle="#d4b25b";
  ctx.font="bold 37px Georgia";
  ctx.fillText("CRASHED",230,282);

  ctx.fillStyle="#eee8d7";
  ctx.font="15px Arial";
  ctx.fillText("Score  "+score,230,322);
  ctx.fillText("Best   "+best,230,348);

  ctx.fillStyle="#8f9b88";
  ctx.font="bold 13px Arial";
  ctx.fillText("ENTER TO TRY AGAIN",230,405);
}

function draw(){
  if(!running){
    finished?endScreen():menu();
    return;
  }

  background();
  traffic.forEach(e=>car(e,e.c));
  pickups.forEach(leaf);
  car(player,paint[selected][1]);

  dust.forEach(p=>{
    ctx.fillStyle="#d0a54c";
    ctx.fillRect(p.x,p.y,3,3);
  });

  hud();
}

/* Keyboard input */
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();

  if(k==="a"||e.key==="arrowleft"){
    left=true;
    e.preventDefault();
  }
  if(k==="d"||e.key==="arrowright"){
    right=true;
    e.preventDefault();
  }
  if(e.code==="Space"){
    boost=true;
    e.preventDefault();
  }
  if(e.key==="Enter"&&!running){
    start();
    e.preventDefault();
  }
});

addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();

  if(k==="a"||e.key==="arrowleft")left=false;
  if(k==="d"||e.key==="arrowright")right=false;
  if(e.code==="Space")boost=false;
});

addEventListener("blur",()=>{
  left=right=boost=false;
});

/* Button input */
function hold(id,setter){
  const b=document.getElementById(id);

  b.addEventListener("pointerdown",e=>{
    e.preventDefault();
    b.setPointerCapture?.(e.pointerId);
    setter(true);
  });

  b.addEventListener("pointerup",e=>{
    e.preventDefault();
    setter(false);
  });

  b.addEventListener("pointercancel",()=>setter(false));
  b.addEventListener("lostpointercapture",()=>setter(false));
}

hold("left",v=>left=v);
hold("right",v=>right=v);
hold("boost",v=>boost=v);

/* Menu car selection and start */
canvas.addEventListener("pointerdown",e=>{
  if(running)return;

  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*460/r.width;
  const y=(e.clientY-r.top)*700/r.height;

  if(!finished && y>195 && y<340){
    const n=Math.floor((x-33)/101);
    if(n>=0&&n<4){
      selected=n;
      return;
    }
  }

  start();
});

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
